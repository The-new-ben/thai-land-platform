name: Thailand Platform quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: PHP ${{ matrix.php }} contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: intl
          tools: none
        env:
          fail-fast: true

      - name: Verify generated homepage assets
        run: python scripts/build_homepage_assets.py --check

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check Pillow==10.4.0

      - name: Verify generated Bangkok assets
        run: python scripts/build_bangkok_rental_assets.py --check

      - name: Verify generated guide assets
        run: python scripts/build_guide_assets.py --check

      - name: Verify generated geography artifacts
        run: python scripts/build_geography_registry.py --check

      - name: Verify generated Digital Islands artifacts
        run: python scripts/build_digital_island_registry.py --check

      - name: Verify generated content and SEO artifacts
        run: |
          python scripts/build_content_registry.py --check
          python scripts/build_bangkok_rental_registry.py --check
          python scripts/build_priority_guides_registry.py --check
          python scripts/build_seo_registry.py --check
          python scripts/build_seo_runtime.py --check
          python scripts/build_content_migration_ledger.py

      - name: Test geography compiler
        run: python tests/geography-builder.test.py

      - name: Test Digital Islands data contract
        run: python tests/digital-island-data.test.py

      - name: Test SEO ownership registry
        run: |
          python tests/seo-ownership-registry.test.py
          python tests/seo-runtime-gates.test.py

      - name: Test content data and compilation
        run: |
          python tests/real-estate-content.test.py
          python tests/bangkok-rental-data.test.py
          python tests/priority-guides-compiler.test.py
          python tests/draft-content-inventory.test.py
          python tests/content-migration-ledger.test.py
          python tests/queued-expired-content.test.py

      - name: Check JavaScript syntax and chat behavior
        run: |
          node --check prototype/app.js
          node --check assets/homepage/homepage.js
          node --check assets/content/bangkok-rental.js
          node --check assets/guides/guides.js
          node --check assets/digital-islands/digital-islands.js
          node --check scripts/live_digital_island_acceptance.cjs
          node --check scripts/live_guides_acceptance.cjs
          node --check scripts/live_homepage_acceptance.cjs
          node --check scripts/live_real_estate_acceptance.cjs
          node --check scripts/live_seo_migration_acceptance.cjs
          node --check scripts/live_sitewide_acceptance.cjs
          node --check tests/live-sitewide-acceptance.test.cjs
          node --check tests/digital-island-live-acceptance.test.cjs
          node tests/live-sitewide-acceptance.test.cjs
          node tests/digital-islands-adapters.test.js
          node tests/digital-island-live-acceptance.test.cjs
          node tests/tawk-state.test.js

      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './plugin-dist/*' -print0 | xargs -0 -n1 php -l

      - name: Test plugin and runtime contracts
        run: |
          php tests/run.php
          php -n tests/geography-resolver.test.php
          php tests/real-estate-runtime.test.php
          php tests/guides-runtime.test.php
          php tests/digital-islands-runtime.test.php
          php tests/digital-islands-settings.test.php

      - name: Build release candidate on minimum PHP
        if: matrix.php == '7.4'
        run: >-
          python scripts/build_plugin_zip.py
          --root .
          --out "$RUNNER_TEMP/thailand-platform.zip"
          --php-bin "$(command -v php)"
          --source-commit "$GITHUB_SHA"
